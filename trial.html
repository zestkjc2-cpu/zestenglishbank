<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEST EXAM MASTER - 자료실</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            try {
                const sessionStr = localStorage.getItem('sb-kdyjvqjzmbknfntmgiqr-auth-token');
                if (sessionStr) {
                    const session = JSON.parse(sessionStr);
                    if (session && session.access_token) {
                        document.documentElement.classList.add('logged-in');
                    }
                }
            } catch (e) {}
        })();
    </script>
    <style>
        .trial-page-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        @media (min-width: 768px) {
            .trial-page-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        .trial-page-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 20px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.4;
        }

        .trial-page-btn:hover {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: var(--white);
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: transparent;
        }
    </style>
</head>
<body style="background: var(--bg-color);">
    <!-- Header injected by Header.js -->

    <section class="features-section" style="padding-top: 150px; min-height: 100vh;">
        <div class="container">
            <div class="section-header text-center">
                <h2 class="section-title">자료실</h2>
                <p class="section-desc">제스트 영어 은행의 학습 자료와 문제들을 다운로드 받으실 수 있습니다.</p>
            </div>
            
            <div class="trial-page-grid">
                <a href="board.html?category=Vocabulary" class="trial-page-btn">어휘</a>
                <a href="board.html?category=School" class="trial-page-btn">내신정복</a>
                <a href="board.html?category=Mistakes" class="trial-page-btn">최다오답15</a>
                <a href="board.html?category=Mock" class="trial-page-btn">모의고사</a>
                <a href="board.html?category=Middle" class="trial-page-btn">중등교과서</a>
                <a href="board.html?category=High" class="trial-page-btn">고등교과서</a>
            </div>
        </div>
    </section>

    <!-- Login Modal injected by Modal.js -->

    <script type="module" src="app.js"></script>
    <script type="module">
        import { authService } from './src/services/apiService.js';
        
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await authService.getSession();
            
            const trialBtns = document.querySelectorAll('.trial-page-btn');
            trialBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (!session) {
                        e.preventDefault();
                        window.showZestAlert('로그인이 필요한 서비스입니다.');
                        document.getElementById('loginModal').classList.add('active');
                    }
                });
            });
        });
    </script>
</body>
</html>
